spring.application.name=Task-Collab
server.port=8080

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://310-sqlserver:1433;databaseName=TaskSys;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=310#sa#pw
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none  
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true  

# JWT Configuration
jwt.secret=YourveryveryverySuperSecretKey123!YourveryveryverySuperSecretKey123!YourveryveryverySuperSecretKey123!    
jwt.expirationMs=86400000  

# CORS Configuration
cors.allowed.origins=http://localhost:3000
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=Authorization,Content-Type
cors.exposed.headers=Authorization
cors.max.age=3600

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.org.hibernate=ERROR

# Swagger Configuration
swagger.enabled=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.docker.compose.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.security.user.name=admin
spring.security.user.password=admin

# disable security for acurator 
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
spring.security.user.name=
spring.security.user.password=
