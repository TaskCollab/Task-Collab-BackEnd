name: Spring Boot Tests (Maven)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (or your desired version)
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Or your desired java version
          distribution: 'temurin' # Or other distribution such as adopt or oracle

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Spring Boot tests with Maven
        run: mvn clean verify

     